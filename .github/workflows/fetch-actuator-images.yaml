name: Fetch Actuator Images

# Manual. Runs where egress is open (GitHub-hosted runner), crawls each
# actuator's cited page for a product photo (and downloads each robot's
# listed photo), self-hosts it under
# frontend/public, and commits the images plus updated dataset back to the
# branch. Trigger via the Actions tab (workflow_dispatch, once this is on the
# default branch) or, on any branch, by touching .github/fetch-images.trigger
# and pushing. The workflow's own commit uses GITHUB_TOKEN, which does not
# start a new run, so it will not loop.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/fetch-images.trigger"

permissions:
  contents: write

jobs:
  fetch-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install

      - name: Fetch and self-host product photos
        run: bun run scripts/fetch_actuator_images.ts

      - name: Optimize product photos
        run: bun run scripts/optimize_actuator_images.ts

      - name: Fetch and self-host robot photos
        run: bun run scripts/fetch_robot_images.ts

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/actuator-images frontend/src/data/actuators.json
          git add frontend/public/robot-images frontend/src/data/robots.json
          if git diff --cached --quiet; then
            echo "No image changes to commit."
            exit 0
          fi
          git commit -m "🖼️ Backfill self-hosted product photos via image fetch workflow"
          git push origin HEAD:${{ github.ref_name }}
