name: Fetch Actuator Images

# Manual only. Runs where egress is open (GitHub-hosted runner), crawls each
# actuator's cited page for a product photo, self-hosts it under
# frontend/public, and commits the images plus updated dataset back to the
# branch it was dispatched on.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2

      - name: Fetch and self-host product photos
        run: bun run scripts/fetch_actuator_images.ts

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/actuator-images frontend/src/data/actuators.json
          if git diff --cached --quiet; then
            echo "No image changes to commit."
            exit 0
          fi
          git commit -m "🖼️ Backfill self-hosted product photos via image fetch workflow"
          git push origin HEAD:${{ github.ref_name }}
