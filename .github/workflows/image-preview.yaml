name: Image Preview (temporary)

# Throwaway: downloads every URL in preview/urls.txt so candidates can be
# inspected from an egress-restricted session. Lives only on its own branch.
on:
  push:
    branches: ["claude/loving-ramanujan-hnqtxt-img-preview"]
    paths: ["preview/urls.txt"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download candidates
        run: |
          mkdir -p preview/out
          rm -f preview/out/*
          n=0
          while read -r url; do
            [ -z "$url" ] && continue
            n=$((n+1))
            curl -sSL -m 60 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/125.0 Safari/537.36" \
              -e "https://www.1x.tech/" -o "preview/out/$n.img" "$url" || echo "$n failed: $url" >> preview/out/errors.txt
            echo "$n $url" >> preview/out/index.txt
          done < preview/urls.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f preview/out
          git commit -m "preview images" || exit 0
          git push
