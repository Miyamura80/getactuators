          cat > ./tmp-pass3.ts <<'EOF_SCRIPT'
          import { readFileSync } from "node:fs";
          import sharp from "sharp";
          const UA =
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0 Safari/537.36";
          const cands = JSON.parse(readFileSync("/tmp/cands.json", "utf8")) as [string, string, string][];
          async function get(url: string, referer?: string) {
              const headers: Record<string, string> = { "User-Agent": UA, Accept: "*/*" };
              if (referer) headers.Referer = referer;
              return fetch(url, { headers, redirect: "follow", signal: AbortSignal.timeout(45000) });
          }
          for (const l of ["https://trampa.co.uk/wp-json/wc/store/products?search=vesc", "https://trampa.co.uk/wp-json/wc/store/products?search=mk6"]) {
              try {
                  const r = await get(l);
                  console.log(`### STORE ${r.status} ${l}`);
                  const j = (await r.json()) as { name: string; permalink: string; images: { src: string }[] }[];
                  for (const p of j) {
                      console.log(`PRODUCT ${p.permalink} | ${p.name}`);
                      for (const im of p.images.slice(0, 4)) console.log(`PIMG ${im.src}`);
                  }
              } catch (e) {
                  console.log(`### STORE ERR ${l} ${(e as Error).message}`);
              }
          }
          for (const p of ["https://www.analog.com/en/products/tmc4671.html", "https://www.analog.com/en/resources/evaluation-hardware-and-software/evaluation-boards-kits/tmc4671-eval.html"]) {
              try {
                  const r = await fetch(p, { headers: { "User-Agent": UA, Accept: "text/html", "Accept-Language": "en-US,en;q=0.9" }, signal: AbortSignal.timeout(120000) });
                  const t = await r.text();
                  console.log(`### PAGE ${r.status} ${p}`);
                  for (const m of t.match(/<meta[^>]+image[^>]+>/gi) ?? []) console.log(`META ${m.slice(0, 300)}`);
                  const urls = new Set(t.match(/(?:https?:\/\/[^"'()\s<>]+|\/-\/media\/[^"'()\s<>]+)\.(?:jpe?g|png|webp)(?:\?[^"'()\s<>]*)?/gi) ?? []);
                  for (const u of [...urls].slice(0, 80)) console.log(`URL ${u}`);
              } catch (e) {
                  console.log(`### PAGE ERR ${p} ${(e as Error).message}`);
              }
          }
          for (const [label, url, ref] of cands) {
              try {
                  const r = await get(url, ref);
                  if (!r.ok) {
                      console.log(`THUMBFAIL ${label} ${r.status}`);
                      continue;
                  }
                  const buf = Buffer.from(await r.arrayBuffer());
                  const meta = await sharp(buf).metadata();
                  const out = await sharp(buf).resize(200, 200, { fit: "inside" }).flatten({ background: "#ffffff" }).jpeg({ quality: 70 }).toBuffer();
                  console.log(`THUMB ${label} ${meta.width}x${meta.height} ${buf.length} ${out.toString("base64")}`);
              } catch (e) {
                  console.log(`THUMBFAIL ${label} ${(e as Error).message}`);
              }
          }
          EOF_SCRIPT
      - run: bun run ./tmp-pass3.ts
