          cat > ./tmp-pass2.ts <<'EOF_SCRIPT'
          import { readFileSync } from "node:fs";
          import sharp from "sharp";
          const UA =
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0 Safari/537.36";
          const cands = JSON.parse(readFileSync("/tmp/cands.json", "utf8")) as [string, string, string][];
          async function get(url: string, referer?: string) {
              const headers: Record<string, string> = { "User-Agent": UA, Accept: "*/*" };
              if (referer) headers.Referer = referer;
              return fetch(url, { headers, redirect: "follow", signal: AbortSignal.timeout(45000) });
          }
          const lists = [
              "https://aifitlab.com/collections/myactuator/products.json?limit=250",
              "https://rcdrone.top/collections/myactuator/products.json?limit=250",
              "https://robotdoo.com/collections/myactuator/products.json?limit=250",
              "https://aifitlab.com/collections/feetech/products.json?limit=250",
          ];
          for (const l of lists) {
              try {
                  const r = await get(l);
                  console.log(`### LIST ${r.status} ${l}`);
                  const j = (await r.json()) as { products: { title: string; handle: string; images: { src: string }[] }[] };
                  for (const p of j.products) {
                      if (!/x8.?pro|x10|l-?9015|scs15|x6-?8|x8-?120/i.test(p.title + p.handle)) continue;
                      console.log(`PRODUCT ${p.handle} | ${p.title}`);
                      for (const im of p.images.slice(0, 4)) console.log(`PIMG ${im.src}`);
                  }
              } catch (e) {
                  console.log(`### LIST ERR ${l} ${(e as Error).message}`);
              }
          }
          const pages = [
              "https://www.maxongroup.com/maxon/view/product/542099",
              "https://www.maxongroup.us/maxon/view/product/542099",
              "https://www.maxongroup.co.uk/maxon/view/product/542099",
              "https://www.maxongroup.de/maxon/view/product/542099",
              "https://trampa.co.uk/product/vesc6-mk6/",
              "https://trampa.co.uk/wp-json/wc/store/products?search=vesc6",
              "https://www.analog.com/en/products/tmc4671.html",
              "https://www.analog.com/en/products/tmc4671-la.html",
          ];
          for (const p of pages) {
              try {
                  const r = await get(p);
                  const t = await r.text();
                  console.log(`### PAGE ${r.status} ${p}`);
                  const urls = new Set(t.match(/https?:\/\/[^"'()\s<>]+\.(?:jpe?g|png|webp)(?:\?[^"'()\s<>]*)?/gi) ?? []);
                  for (const m of t.match(/<meta[^>]+image[^>]+>/gi) ?? []) console.log(`META ${m.slice(0, 300)}`);
                  for (const u of [...urls].slice(0, 60)) console.log(`URL ${u}`);
              } catch (e) {
                  console.log(`### PAGE ERR ${p} ${(e as Error).message}`);
              }
          }
          for (const [label, url, ref] of cands) {
              try {
                  const r = await get(url, ref);
                  if (!r.ok) {
                      console.log(`THUMBFAIL ${label} ${r.status}`);
                      continue;
                  }
                  const buf = Buffer.from(await r.arrayBuffer());
                  const meta = await sharp(buf).metadata();
                  const out = await sharp(buf).resize(200, 200, { fit: "inside" }).flatten({ background: "#ffffff" }).jpeg({ quality: 70 }).toBuffer();
                  console.log(`THUMB ${label} ${meta.width}x${meta.height} ${buf.length} ${out.toString("base64")}`);
              } catch (e) {
                  console.log(`THUMBFAIL ${label} ${(e as Error).message}`);
              }
          }
          EOF_SCRIPT
      - run: bun run ./tmp-pass2.ts
